- id: HIB-05
  tipo: hibrida
  idioma: es
  pregunta: "¿Qué pedidos del cliente {cliente} siguen dentro del plazo de devolución?"
  variables:
    cliente: "SELECT TOP 1 p.id_cliente FROM pedidos p JOIN envios e ON e.id_pedido = p.id_pedido WHERE p.estado = 'entregado' AND e.estado_envio = 'entregado' ORDER BY e.fecha_entrega_real DESC"
  ruta: hibrida
  usa_documentos: true
  documento: politica
  sql_referencia: >
    SELECT p.id_pedido FROM pedidos p JOIN envios e ON e.id_pedido = p.id_pedido
    WHERE p.id_cliente = {cliente} AND p.estado = 'entregado' AND e.estado_envio = 'entregado'
    AND DATEDIFF(DAY, e.fecha_entrega_real, CAST(GETDATE() AS DATE)) <= 30
  comparar: {exacto: true}

