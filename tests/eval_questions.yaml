# Suite de evaluacion (spec seccion 8). 39 preguntas en castellano e ingles.
#
# Campos:
#   id, tipo, pregunta, idioma (es|en)
#   ruta: ruta esperada, o lista de rutas aceptables
#   sql_referencia: consulta T-SQL con la respuesta correcta (se ejecuta al evaluar, por lo
#                   que siempre coincide con los datos actuales)
#   comparar: {exacto: true/false, tolerancia: numero}   (por defecto 0.01)
#   usa_documentos / documento: la respuesta debe apoyarse en un documento (parte de su nombre)
#   sin_sql: true         no debe ejecutarse SQL
#   sin_fuentes: true     no debe consultar ninguna fuente
#   debe_contener / debe_contener_alguno / no_debe_contener: textos en la respuesta
#   conjunto: ejemplo = pregunta casi identica a una del prompt (router o few-shot); por defecto, independiente
#   historial: turnos previos [[rol, texto], ...] para probar preguntas de seguimiento
#   variables: {nombre: consulta} valores calculados en la base y usados como {nombre} en la pregunta

# ----------------------------------------------------------------------------- SQL
- id: SQL-01
  tipo: sql
  idioma: es
  pregunta: "¿Cuántos clientes hay en cada país?"
  ruta: sql
  sql_referencia: "SELECT pais, COUNT(*) AS n FROM clientes GROUP BY pais"
  comparar: {exacto: true}

- id: SQL-02
  tipo: sql
  idioma: en
  pregunta: "How many orders have the status delivered?"
  ruta: sql
  sql_referencia: "SELECT COUNT(*) AS n FROM pedidos WHERE estado = 'entregado'"

- id: SQL-03
  tipo: sql
  idioma: es
  pregunta: "¿Cuál es el cliente que más gastó en total?"
  ruta: sql
  sql_referencia: >
    SELECT TOP 1 c.nombre, c.apellido, SUM(d.subtotal) AS gasto
    FROM clientes c JOIN pedidos p ON p.id_cliente = c.id_cliente
    JOIN detalle_pedidos d ON d.id_pedido = p.id_pedido
    WHERE p.estado IN ('pagado', 'enviado', 'entregado')
    GROUP BY c.id_cliente, c.nombre, c.apellido ORDER BY gasto DESC

- id: SQL-04
  tipo: sql
  idioma: en
  pregunta: "What is the average price of the products in the Monitores category?"
  ruta: sql
  sql_referencia: >
    SELECT AVG(CAST(pr.precio AS FLOAT)) AS promedio
    FROM productos pr JOIN categorias c ON c.id_categoria = pr.id_categoria
    WHERE c.nombre = 'Monitores'
  comparar: {tolerancia: 0.5}

- id: SQL-05
  tipo: sql
  idioma: es
  pregunta: "¿Cuántos productos están agotados?"
  ruta: sql
  sql_referencia: "SELECT COUNT(*) AS n FROM productos WHERE stock = 0 AND activo = 1"

- id: SQL-06
  tipo: sql
  idioma: es
  pregunta: "¿Cuántos pedidos tiene el cliente 12?"
  ruta: sql
  sql_referencia: "SELECT COUNT(*) AS n FROM pedidos WHERE id_cliente = 12"

- id: SQL-07
  tipo: sql
  idioma: en
  pregunta: "Show me the top 3 categories by revenue"
  ruta: sql
  sql_referencia: >
    SELECT TOP 3 cat.nombre, SUM(d.subtotal) AS ingresos
    FROM detalle_pedidos d JOIN productos pr ON pr.id_producto = d.id_producto
    JOIN categorias cat ON cat.id_categoria = pr.id_categoria
    JOIN pedidos p ON p.id_pedido = d.id_pedido
    WHERE p.estado IN ('pagado', 'enviado', 'entregado')
    GROUP BY cat.id_categoria, cat.nombre ORDER BY ingresos DESC
  comparar: {exacto: true}

- id: SQL-08
  tipo: sql
  idioma: es
  pregunta: "¿Cuántas reseñas tienen calificación 1?"
  ruta: sql
  sql_referencia: "SELECT COUNT(*) AS n FROM resenas WHERE calificacion = 1"

- id: SQL-09
  tipo: sql
  idioma: es
  pregunta: "¿Qué productos nunca fueron vendidos?"
  ruta: sql
  sql_referencia: >
    SELECT nombre FROM productos
    WHERE id_producto NOT IN (SELECT id_producto FROM detalle_pedidos)

- id: SQL-10
  tipo: sql
  idioma: es
  pregunta: "¿Y en Uruguay?"
  historial: [["human", "¿Cuántos clientes hay en Argentina?"], ["ai", "Hay 39 clientes en Argentina."]]
  ruta: sql
  sql_referencia: "SELECT COUNT(*) AS n FROM clientes WHERE pais = 'Uruguay'"

