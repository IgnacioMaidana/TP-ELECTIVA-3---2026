# ----------------------------------------------------------------------------- HIBRIDAS
- id: HIB-01
  tipo: hibrida
  conjunto: ejemplo
  idioma: es
  pregunta: "¿Qué pedidos del cliente 12 siguen dentro del plazo de devolución?"
  ruta: hibrida
  usa_documentos: true
  documento: politica
  sql_referencia: >
    SELECT p.id_pedido FROM pedidos p JOIN envios e ON e.id_pedido = p.id_pedido
    WHERE p.id_cliente = 12 AND p.estado = 'entregado' AND e.estado_envio = 'entregado'
    AND DATEDIFF(DAY, e.fecha_entrega_real, CAST(GETDATE() AS DATE)) <= 30
  comparar: {exacto: true}

- id: HIB-02
  tipo: hibrida
  conjunto: ejemplo
  idioma: es
  pregunta: "¿Cuántos envíos tienen derecho al reintegro del costo de envío?"
  ruta: hibrida
  usa_documentos: true
  documento: politica
  sql_referencia: >
    SELECT COUNT(*) AS n FROM envios
    WHERE estado_envio = 'entregado'
    AND DATEDIFF(DAY, fecha_entrega_estimada, fecha_entrega_real) > 2

- id: HIB-03
  tipo: hibrida
  conjunto: ejemplo
  idioma: en
  pregunta: "How many shipments qualify for a shipping cost refund?"
  ruta: hibrida
  usa_documentos: true
  documento: politica
  sql_referencia: >
    SELECT COUNT(*) AS n FROM envios
    WHERE estado_envio = 'entregado'
    AND DATEDIFF(DAY, fecha_entrega_estimada, fecha_entrega_real) > 2

